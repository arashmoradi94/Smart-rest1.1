name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        # npm ci fails if package-lock.json is out of sync with package.json in this repo; fall back to npm install
        run: npm ci || npm install
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Run tests
        run: npm test
      - name: Run prisma migrate if DATABASE_URL
        if: env.DATABASE_URL != ''
        run: npx prisma migrate deploy
